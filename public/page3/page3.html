<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Riya · Photo Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: url('./background.png') center center / cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .photo-experience {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
    }

    .image-container img {
      position: absolute;
      width: auto;
      height: auto;
      max-width: 92%;
      max-height: 88%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease;
      transform: scale(1.02);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(40, 30, 20, 0.08);
      will-change: transform, opacity;
    }

    .image-container img.active {
      opacity: 1;
      transform: scale(1);
    }

    .image-container img.exit {
      opacity: 0;
      transform: scale(1.04);
    }

    .photo-experience::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(40, 30, 24, 0.06) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .photo-counter {
      position: absolute;
      bottom: 36px;
      left: 36px;
      z-index: 15;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #a88a78;
      background: rgba(250, 244, 238, 0.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255, 245, 235, 0.15);
      opacity: 0.6;
    }

    /* ===== BUTTON STYLES - SAME AS PAGE 4 ===== */
    /* ===== BUTTON STYLES - IMPROVED CONTRAST ===== */
    .button-container {
      position: absolute;
      bottom: 36px;
      right: 36px;
      z-index: 9999;
      pointer-events: none;
    }

    #nextBtn {
      padding: 10px 44px;
      border-radius: 60px;
      border: 2px solid #ffd700;
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 4px 20px rgba(0, 0, 0, 0.06);
      pointer-events: auto;
      color: #8B6B3D;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.3s ease, background 0.3s ease;
    }

    #nextBtn.show {
      opacity: 1;
      visibility: visible;
      animation: buttonGlow 1.5s infinite alternate;
    }

    #nextBtn i {
      font-size: 18px;
      color: #8B6B3D;
      transition: transform 0.3s ease;
    }

    #nextBtn:hover {
      background: rgba(255, 248, 240, 1);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.7), 0 4px 24px rgba(0, 0, 0, 0.08);
      transform: scale(1.02);
    }

    #nextBtn:hover i {
      transform: translateX(5px);
    }

    #nextBtn:active {
      transform: scale(0.94);
      background: rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 60px gold;
    }

    @keyframes buttonGlow {
      0% {
        box-shadow: 0px 0px 8px rgba(255, 215, 0, 0.4), 0px 0px 16px rgba(255, 215, 0, 0.2);
      }

      100% {
        box-shadow: 0px 0px 16px rgba(255, 215, 0, 0.7), 0px 0px 32px rgba(255, 215, 0, 0.4);
      }
    }

    @media (max-width: 768px) {
      .image-container img {
        max-width: 94%;
        max-height: 82%;
        border-radius: 8px;
      }

      .button-container {
        bottom: 24px;
        right: 20px;
      }

      #nextBtn {
        padding: 0.7rem 1.6rem;
        font-size: 0.9rem;
      }

      #nextBtn i {
        font-size: 16px;
      }

      .photo-counter {
        bottom: 28px;
        left: 20px;
        font-size: 0.65rem;
        padding: 4px 12px;
      }
    }

    @media (max-width: 480px) {
      .image-container img {
        max-width: 96%;
        max-height: 76%;
        border-radius: 6px;
      }

      .button-container {
        bottom: 20px;
        right: 16px;
      }

      #nextBtn {
        padding: 0.6rem 1.4rem;
        font-size: 0.8rem;
        gap: 8px;
      }

      #nextBtn i {
        font-size: 14px;
      }

      .photo-counter {
        bottom: 24px;
        left: 16px;
        font-size: 0.55rem;
        padding: 3px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .image-container img {
        transition: opacity 0.6s ease !important;
        transform: none !important;
      }

      .image-container img.active {
        transform: none !important;
      }

      .image-container img.exit {
        transform: none !important;
      }

      #nextBtn {
        transition: opacity 0.4s ease !important;
        transform: none !important;
      }

      #nextBtn.show {
        transform: none !important;
      }

      #nextBtn:hover {
        transform: none !important;
      }

      #nextBtn:hover i {
        transform: none !important;
      }
    }

    .loading {
      font-family: 'DM Serif Display', serif;
      color: #b28b78;
      font-size: 1.2rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>

<body>
  <div class="photo-experience" id="photoExperience">
    <div class="image-container" id="imageContainer">
      <div class="loading" id="loadingText">🌸 loading memories...</div>
    </div>

    <div class="photo-counter" id="photoCounter">1 / 9</div>

    <!-- BUTTON - SAME STYLE AS PAGE 4 -->
    <div class="button-container">
      <button id="nextBtn">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ----- ALL 9 RIYA PHOTOS - EXACT filenames from your screenshot -----
      const PHOTOS = [
        './IMG_20260826_094207_668.jpeg',
        './IMG_20260826_094207_668_1.jpeg',
        './IMG_20260826_094207_668_3.jpeg',
        './IMG_20260826_094207_668_6.jpeg',
        './IMG_20260826_094207_668_7.jpeg',
        './IMG_20260826_094207_668_10.jpeg',
        './IMG_20260826_094207_669_5.jpeg',
        './IMG_20260826_094207_669_8.jpeg',
        './IMG_20260826_094207_670_9.jpeg',
      ];

      const PHOTO_DISPLAY_MS = 3800;
      const CROSSFADE_MS = 1200;
      const NEXT_BUTTON_DELAY_MS = 5000;

      const container = document.getElementById('imageContainer');
      const counter = document.getElementById('photoCounter');
      const nextBtn = document.getElementById('nextBtn');

      let currentIndex = 0;
      let intervalId = null;
      let isTransitioning = false;
      let audioElement = null;

      function buildImages() {
        const loading = document.getElementById('loadingText');
        if (loading) loading.remove();

        let loadedCount = 0;

        PHOTOS.forEach((src, i) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = `Riya photo ${i + 1}`;
          img.dataset.index = i;
          img.className = (i === 0) ? 'active' : '';
          img.loading = 'lazy';

          img.onload = function () {
            loadedCount++;
            console.log(`✅ Loaded: ${src}`);
            if (loadedCount === PHOTOS.length) {
              console.log('🎉 All 9 photos loaded!');
            }
          };

          img.onerror = function () {
            console.warn(`❌ Failed to load: ${src}`);
            this.style.display = 'none';
            loadedCount++;
            if (loadedCount === PHOTOS.length && document.querySelectorAll('img:not([style*="display: none"])').length === 0) {
              const errorMsg = document.createElement('div');
              errorMsg.style.cssText = 'color: #b28b78; font-family: "DM Serif Display", serif; font-size: 1.2rem; padding: 2rem; text-align: center; max-width: 80%;';
              errorMsg.innerHTML = '🌸 Images not found.<br><small style="font-size: 0.8rem; color: #a88a78;">Check if files are in the same folder as page3.html</small>';
              container.appendChild(errorMsg);
            }
          };

          container.appendChild(img);
        });
      }

      function showPhoto(index) {
        if (isTransitioning) return;
        if (index < 0 || index >= PHOTOS.length) return;

        const images = container.querySelectorAll('img');
        if (!images.length) return;

        isTransitioning = true;

        images.forEach(img => {
          img.classList.remove('active', 'exit');
        });

        const currentImg = images[currentIndex];
        if (currentImg) {
          currentImg.classList.add('exit');
        }

        const nextImg = images[index];
        if (nextImg) {
          setTimeout(() => {
            nextImg.classList.add('active');
          }, 60);
        }

        counter.textContent = `${index + 1} / ${PHOTOS.length}`;

        setTimeout(() => {
          currentIndex = index;
          isTransitioning = false;
        }, CROSSFADE_MS + 50);
      }

      function nextPhoto() {
        if (isTransitioning) return;
        const nextIndex = (currentIndex + 1) % PHOTOS.length;
        showPhoto(nextIndex);
      }

      function startSlideshow() {
        if (intervalId) clearInterval(intervalId);
        showPhoto(0);
        intervalId = setInterval(nextPhoto, PHOTO_DISPLAY_MS);
      }

      function stopSlideshow() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      // ===== AUDIO - AUTOPLAY + LOOP, NO MUTE =====
      function setupAudio() {
        try {
          audioElement = new Audio('./song.mp3');
          audioElement.loop = true;
          audioElement.volume = 0.5;
          audioElement.preload = 'auto';

          // Autoplay attempt
          audioElement.play().catch(() => {
            console.log('🔇 Autoplay blocked. Will play on user interaction.');
            // Agar autoplay block ho toh user click pe play karega
            document.addEventListener('click', function playOnClick() {
              audioElement.play().catch(() => { });
              document.removeEventListener('click', playOnClick);
            }, { once: true });
          });

        } catch (e) {
          console.warn('Audio setup error:', e);
        }
      }

      function revealNextButton() {
        nextBtn.classList.add('show');
      }

      function goToNextPage() {
        // Music fade out
        if (audioElement) {
          const fadeOut = setInterval(() => {
            if (audioElement.volume > 0.05) {
              audioElement.volume = Math.max(0, audioElement.volume - 0.05);
            } else {
              audioElement.pause();
              audioElement.volume = 0.5;
              clearInterval(fadeOut);
            }
          }, 80);
        }

        if (window.parent) {
          window.parent.postMessage({ type: 'NEXT_PAGE' }, '*');
        } else {
          console.log('📤 NEXT_PAGE message sent (parent)');
        }
      }

      function init() {
        console.log('📍 Current page:', window.location.href);
        console.log('🔍 Looking for images in same folder as page3.html');
        buildImages();
        setupAudio();
        startSlideshow();

        setTimeout(revealNextButton, NEXT_BUTTON_DELAY_MS);

        nextBtn.addEventListener('click', function (e) {
          e.preventDefault();
          stopSlideshow();
          goToNextPage();
        });

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            stopSlideshow();
          } else {
            if (!intervalId) {
              startSlideshow();
            }
          }
        });

        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion) {
          document.querySelectorAll('img').forEach(img => {
            img.style.transition = 'opacity 0.6s ease';
          });
        }

        console.log('🌸 Riya Photo Experience loaded — 9 memories');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>

</html>
